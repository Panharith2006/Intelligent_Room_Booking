name: Production Environment CI/CD

on:
  push:
    branches: [ main, master, production ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master, production ]

env:
  PYTHON_VERSION: '3.11'
  DJANGO_SETTINGS_MODULE: room_booking_system.settings_production

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov

    - name: Create .env file for testing
      run: |
        cat > .env << EOF
        SECRET_KEY=test-secret-key-for-ci-only
        DEBUG=False
        ALLOWED_HOSTS=localhost,127.0.0.1
        USE_SQLITE=False
        DB_NAME=test_db
        DB_USER=root
        DB_PASSWORD=test_password
        DB_HOST=127.0.0.1
        DB_PORT=3306
        EOF

    - name: Run migrations
      run: python manage.py migrate --noinput

    - name: Run Django tests
      run: python manage.py test --verbosity=2 --failfast

    - name: Run integration tests
      run: |
        if [ -f "pytest.ini" ]; then
          pytest tests/ --cov=. --cov-report=xml --cov-report=html --cov-fail-under=70
        else
          echo "No pytest configuration found"
        fi
      continue-on-error: false

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
      if: always()

  security-scan:
    name: Security & Compliance Scanning
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety bandit

    - name: Run safety check (dependency vulnerabilities)
      run: safety check --json

    - name: Run bandit security scanner
      run: bandit -r . -f json -o bandit-report.json

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json
      if: always()

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install code quality tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort

    - name: Check code formatting with black
      run: black --check .
      continue-on-error: true

    - name: Check import sorting with isort
      run: isort --check-only .
      continue-on-error: true

    - name: Run flake8
      run: flake8 . --count --statistics --max-line-length=127

    - name: Run pylint
      run: pylint **/*.py --fail-under=7.0
      continue-on-error: true

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan, code-quality]
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/room-booking-system
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/room-booking-system:production-${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/room-booking-system:production-latest
          ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, security-scan, code-quality, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/production')
