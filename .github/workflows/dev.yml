name: Development Environment CI/CD

on:
  push:
    branches: [ dev, develop, development ]
  pull_request:
    branches: [ dev, develop, development ]

env:
  PYTHON_VERSION: '3.11'
  DJANGO_SETTINGS_MODULE: room_booking_system.settings

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov

    - name: Create .env file for testing
      run: |
        cat > .env << EOF
        SECRET_KEY=test-secret-key-for-ci-only
        DEBUG=True
        ALLOWED_HOSTS=localhost,127.0.0.1
        USE_SQLITE=False
        DB_NAME=test_db
        DB_USER=root
        DB_PASSWORD=test_password
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DEEPSEEK_API_KEY=${{ secrets.DEV_DEEPSEEK_API_KEY }}
        GROQ_API_KEY=${{ secrets.DEV_GROQ_API_KEY }}
        EOF

    - name: Run migrations
      run: python manage.py migrate --noinput

    - name: Run Django tests
      run: python manage.py test --verbosity=2

    - name: Check code formatting with flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: room-booking-system:dev-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment:
      name: development
      url: ${{ secrets.DEV_APP_URL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to development server
      run: |
        echo "🚀 Deploying to development environment..."
        echo "Configure your deployment commands here"
        # Example: SSH deployment, Heroku, Railway, etc.
        # ssh user@dev-server "cd /app && git pull && docker-compose up -d"

    - name: Deployment notification
      run: |
        echo "✅ Development deployment completed"
        echo "Environment: Development"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
