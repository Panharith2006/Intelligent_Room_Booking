
{% load static %}
<link rel="stylesheet" href="{% static 'AdminPage/css/admin_header.css' %}">

<div class="header">
    <div class="container">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/km/e/ee/Rupp_logo.png?20090803154844" alt="RUPP Logo">
            <div>Royal University of Phnom Penh</div>
        </div>
        <button class="hamburger" aria-label="Toggle navigation" onclick="document.querySelector('.nav').classList.toggle('open')">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav">
            <a href="{% url 'accounts:admin_dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{% url 'booking:admin_schedule' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_schedule' %}active{% endif %}">Schedule</a>
            <a href="{% url 'accounts:admin_settings' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_settings' %}active{% endif %}">Settings</a>
        </div>
        <div class="user-info">
            <span>Welcome, {{ user.first_name|default:user.username }}</span>
            <a href="{% url 'accounts:logout' %}" class="btn-outline-danger"><i class="fas fa-sign-out-alt"></i> Log Out</a>
        </div>
    </div>
</div>
